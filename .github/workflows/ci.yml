name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 13 is the oldest GCC that reads the vendored C23; 14 is the
          # newest the runner ships.
          - { os: ubuntu-latest, cc: gcc-13 }
          - { os: ubuntu-latest, cc: gcc-14 }
          # The runner's own clang is 18, which does not read constexpr.
          - { os: ubuntu-latest, cc: clang-19 }
          - { os: macos-latest, cc: clang }
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # The distribution's own package first: Ubuntu 24.04 and 26.04 both
      # carry clang 19 beside their default. apt.llvm.org's llvm.sh is only
      # the fallback, because it registers its key with apt-key, which Ubuntu
      # 26.04 no longer has.
      - name: Install clang 19
        if: matrix.cc == 'clang-19'
        run: |
          sudo apt-get update -q
          if ! sudo apt-get install -y -q clang-19; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 19
          fi

      - name: Name the compiler
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          ${{ matrix.cc }} --version | head -1

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test with full cgo pointer checks
        run: GOEXPERIMENT=cgocheck2 go test -count=1 ./...

      - name: Fuzz briefly
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=20s .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Name the compiler
        run: echo "CC=gcc-14" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
